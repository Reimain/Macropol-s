[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gratimos"
version = "0.1.0"
description = "Gratimos generator and SLPIE — a self-building agent kernel plus a universal package and architecture intelligence engine."
readme = "docs/README.md"
# 3.11 for stdlib tomllib: SLPIE reads pyproject.toml and Cargo.toml during
# discovery, and a third-party TOML parser would breach the zero-dependency rule.
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Macropol-s" }]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
sql = ["SQLAlchemy>=2.0", "alembic>=1.13"]
s3 = ["boto3>=1.34"]
delta = ["deltalake>=0.17"]
media = ["Pillow>=10.0"]
dev = ["pytest>=8.0"]
all = ["openpyxl>=3.1", "SQLAlchemy>=2.0", "alembic>=1.13", "boto3>=1.34", "deltalake>=0.17", "Pillow>=10.0", "pytest>=8.0"]

[project.scripts]
gratimos = "gratimos.cli:main"
# `slpie = "slpie.cli:main"` is added in phase 13, with the CLI it points at —
# a console script for a module that does not exist yet is a broken command.

[tool.setuptools.packages.find]
include = ["gratimos*", "slpie*"]

# The interface ships as data files. Without this the UI installs with no
# assets and `slpie ui` serves a 404 from a working server.
[tool.setuptools.package-data]
"slpie.ui" = ["app/*.html", "app/*.js", "app/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
