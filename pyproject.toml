[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gratimos"
version = "0.1.0"
description = "Gratimos generator — a self-building agent kernel: data-shaped code generation, ContextFlow versioning, sandboxed transformations, and A2A agent interop."
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Macropol-s" }]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
sql = ["SQLAlchemy>=2.0", "alembic>=1.13"]
s3 = ["boto3>=1.34"]
delta = ["deltalake>=0.17"]
media = ["Pillow>=10.0"]
dev = ["pytest>=8.0"]
all = ["openpyxl>=3.1", "SQLAlchemy>=2.0", "alembic>=1.13", "boto3>=1.34", "deltalake>=0.17", "Pillow>=10.0", "pytest>=8.0"]

[project.scripts]
gratimos = "gratimos.cli:main"

[tool.setuptools.packages.find]
include = ["gratimos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
