# Alembic, pointed at this package's migrations.
#
# `sqlalchemy.url` is deliberately empty: `env.py` reads SLPIE_DATABASE_URL, so
# there is one place a connection string is configured and it is the same one
# the store, the tests and CI use.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
