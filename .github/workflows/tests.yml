name: tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The kernel must pass with nothing installed but Python. That is invariant 4,
  # and until this job existed it was asserted by a test
  # (`test_the_kernel_has_no_third_party_dependencies`) that itself ran inside an
  # environment where the extras happened to be present — so a stray dependency
  # would have been caught by the ast walk, but a stray *runtime* need would not.
  # This job is the one that would notice.
  kernel:
    name: kernel — stdlib only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with no extras at all
        run: pip install -e .

      - name: Nothing but the standard library is installed
        run: |
          python - <<'PY'
          import importlib.metadata as md
          allowed = {"gratimos", "pip", "setuptools", "wheel", "pkg-resources"}
          extra = sorted(
              d.metadata["Name"] for d in md.distributions()
              if (d.metadata["Name"] or "").lower() not in allowed
          )
          assert not extra, f"the kernel install pulled in {extra}"
          print("clean:", sorted(d.metadata["Name"] for d in md.distributions()))
          PY

      # `ignore=tests/test_enterprise_*` because ring 1 needs the extras this
      # job exists to prove the kernel does *not*. They run in the suite job.
      - name: The suite runs offline, with no test dependencies beyond pytest
        run: |
          pip install pytest
          python -m pytest -q -p no:randomly \
            --ignore=tests/test_enterprise_boundaries.py \
            --ignore=tests/test_enterprise_workspaces.py

  suite:
    name: suite — py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (stdlib tomllib, per pyproject). The newest is here
        # so a deprecation lands as a failed job rather than as a surprise at
        # the next release.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e '.[dev,workspaces,cloud]'

      # `corpus` is deselected: the fetched tier needs network, and a CI job that
      # reached the npm registry would be a flaky job that also breaks the
      # offline guarantee the kernel job above exists to prove.
      - name: Run the suite
        run: python -m pytest -q -m "not corpus"

      - name: Coverage
        if: matrix.python == '3.11'
        run: |
          python -m coverage run -m pytest -q -m "not corpus"
          python -m coverage report

  invariants:
    name: invariants — boundaries, rings, purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'

      # Separated from the suite so a broken architectural boundary is legible
      # in the checks list rather than buried in 2400 dots. These are also the
      # tests that must fail loudly on a restructure — see docs/AUDIT.md §1.1.
      - name: The architectural invariants hold
        run: |
          python -m pytest -q \
            tests/test_slpie_boundaries.py \
            tests/test_reuse_boundaries.py \
            tests/test_slpie_audit.py \
            tests/test_slpie_dispatch.py

      - name: The judge agrees, and its digest is reproducible
        run: |
          python -m slpie.cli audit > /tmp/first.txt
          python -m slpie.cli audit > /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt \
            || (echo "the audit is not reproducible over an unchanged tree" && exit 1)

  acceptance:
    name: acceptance — every verb, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `jq` is dispatched to by the `tool` verb. It is present on the GitHub
      # runner image; if it ever is not, the run reports a capability gap and
      # `tool` goes uncovered, which fails the coverage claim rather than
      # passing quietly with a hole in it.
      - run: pip install -e .

      # This is the job that catches a verb registered without an exercise.
      # `--baseline` is deliberately *not* passed: a CI run that re-recorded the
      # timings could never regress against them.
      - name: Drive every verb, then check the four claims
        run: python acceptance.py

  lint:
    name: imports sorted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install isort
      # Settings come from pyproject.toml, so this and a local `isort .` cannot
      # disagree about what correct looks like. No black — see the note in
      # pyproject.toml explaining why.
      - run: python -m isort --check-only --diff slpie slpie_enterprise gratimos tests tools

  docs:
    name: docs — the whole API, from a kernel-only install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `.[docs]` and nothing else. `autodoc_mock_imports` stands in for every
      # ring-1 and optional-extra package, so this job also proves the
      # documentation is not the one thing that quietly needs kubernetes and
      # boto3 to render.
      - run: pip install -e '.[docs]'

      # `-W` but not `-n`. Nitpicky mode demands a resolvable target for every
      # type in every signature, including this codebase's own Protocols and
      # `typing` generics; the noise it produces is about reference plumbing
      # rather than about the documentation, and a strict flag nobody can keep
      # green stops being a check.
      - name: Every module renders, and a broken reference fails the build
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      # Reported, not gated. Documentation coverage is a number worth watching;
      # turning it into a threshold invites a docstring written to move it.
      - name: What is documented, measured
        run: |
          python -m sphinx -b coverage docs docs/_build/coverage
          cat docs/_build/coverage/python.txt

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

  notebooks:
    name: notebooks — every cell runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e .
      - run: pip install -r requirements-notebooks.txt

      # The notebooks are generated. An edit made in the .ipynb and not in the
      # spec would be silently overwritten on the next rebuild, so it is caught
      # here instead.
      - name: The notebooks match their spec
        run: python -m tools.notebooks.build --check

      # The reason the notebooks are worth having. A notebook nobody runs is a
      # blog post that has learned to lie: it looks executable, so a reader
      # assumes it was checked.
      - name: Every cell in every notebook runs
        run: python -m tools.notebooks.run
