<!doctype html>
<!-- The defaults are on the element rather than applied by script, so the
     common case paints correctly on the very first frame. `boot.js` changes
     them only when a stored choice differs — `script-src 'self'` forbids an
     inline bootstrap and there is no build step to inline one for us. -->
<html lang="en" data-theme="dark" data-density="bench">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLPIE</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <!-- The shell, and only the shell. Every screen is a module mounted into
       `<main>` by `shell.js` from the generated manifest, so a screen is a file
       rather than a `<section>` somebody has to remember to add here. The
       previous version of this page carried eight hand-written sections and a
       `data-view` attribute per nav button, which is a second routing table
       maintained by hand beside the real one. -->
  <header>
    <div class="brand">SLPIE <span id="environment">—</span></div>
    <span id="target" class="pill simulated">simulated</span>
    <span id="connection" class="pill" title="live event stream">offline</span>
    <div id="appearance"></div>
  </header>

  <main>
    <div id="outlet">
      <!-- Replaced on the first route. Static rather than blank so the page is
           not empty if scripting is disabled or a module fails to load. -->
      <p class="empty">Loading the console…</p>
    </div>
  </main>

  <script type="module" src="/boot.js"></script>
  <script type="module" src="/shell.js"></script>
</body>
</html>
