<!doctype html>
<!-- The defaults are on the element rather than applied by script, so the
     common case paints correctly on the very first frame. `boot.js` changes
     them only when a stored choice differs — `script-src 'self'` forbids an
     inline bootstrap and there is no build step to inline one for us. -->
<html lang="en" data-theme="light" data-density="bench">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLPIE</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Named explicitly, or the browser asks for `/favicon.ico` on every load
       and logs a 404 nobody put there. Found by opening the page in a real
       browser, which is the only way that request is visible at all. -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <!-- The shell, and only the shell. Every screen is a module mounted into
       `<main>` by `shell.js` from the generated manifest, so a screen is a file
       rather than a `<section>` somebody has to remember to add here. The
       previous version of this page carried eight hand-written sections and a
       `data-view` attribute per nav button, which is a second routing table
       maintained by hand beside the real one.

       The rail holds destinations; the bar holds facts about the current
       connection. A reader looking for somewhere to go looks left; a reader
       asking how much to trust what they see looks up. -->
  <aside class="rail">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <rect x="1" y="1" width="16" height="16" rx="4" fill="none"
              stroke="currentColor" stroke-width="1.5"/>
        <path d="M5 11.5 L8 6 L11 11.5" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="13" cy="5.5" r="1.4" fill="currentColor"/>
      </svg>
      SLPIE
    </div>
    <!-- Replaced by `shell.js` from the generated screen manifest. -->
  </aside>

  <div class="topbar">
    <!-- These two carry honest defaults rather than confident-looking ones,
         because the first frame is also a frame: `shell.js` writes both from
         the status cell, and until it answers the bar must not claim an
         environment nobody opened. -->
    <div class="context">
      <span class="what">Environment</span>
      <span id="environment" class="unfilled">none open</span>
    </div>
    <div class="spacer"></div>
    <span id="target" class="pill simulated">simulated</span>
    <span id="connection" class="pill" title="live event stream">offline</span>
    <div id="appearance"></div>
  </div>

  <main>
    <div id="outlet">
      <!-- Replaced on the first route. Static rather than blank so the page is
           not empty if scripting is disabled or a module fails to load. -->
      <p class="empty">Loading the console…</p>
    </div>
  </main>

  <script type="module" src="/boot.js"></script>
  <script type="module" src="/shell.js"></script>
</body>
</html>
